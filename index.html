<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire Scolaire — Collège Louis Lumière</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-out forwards'
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card-animate { animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-brand-500 selection:text-white pb-12">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">

    <!-- Header -->
    <header class="mb-8 text-center relative">
      <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-brand-500/15 rounded-full blur-3xl pointer-events-none"></div>

      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-panel text-brand-400 text-xs font-semibold mb-4 border border-brand-500/20 shadow-sm">
        <i class="fa-solid fa-graduation-cap text-sm"></i> Collège Louis Lumière
      </div>

      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-400 bg-clip-text text-transparent mb-3">
        Annuaire Scolaire
      </h1>
      <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto">
        Élèves, Enseignants, Personnel & Parents d'élèves.
      </p>

      <!-- Stats -->
      <div class="mt-6 inline-flex flex-wrap items-center justify-center gap-4 sm:gap-6 px-6 py-2.5 rounded-2xl glass-panel text-xs text-slate-300">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-user-graduate text-brand-400"></i>
          <span>Élèves : <strong id="stat-students" class="text-white font-bold">0</strong></span>
        </div>
        <div class="h-3 w-px bg-slate-800 hidden sm:block"></div>
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-chalkboard-user text-indigo-400"></i>
          <span>Profs : <strong id="stat-teachers" class="text-white font-bold">0</strong></span>
        </div>
        <div class="h-3 w-px bg-slate-800 hidden sm:block"></div>
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-user-gear text-amber-400"></i>
          <span>Personnel : <strong id="stat-staff" class="text-white font-bold">0</strong></span>
        </div>
        <div class="h-3 w-px bg-slate-800 hidden sm:block"></div>
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-people-roof text-emerald-400"></i>
          <span>Parents : <strong id="stat-parents" class="text-white font-bold">0</strong></span>
        </div>
      </div>
    </header>

    <!-- Bar de recherche & Filtres -->
    <div class="mb-8 p-4 rounded-2xl glass-panel shadow-2xl space-y-4">
      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <input 
          type="text" 
          id="search-input"
          placeholder="Rechercher par nom, prénom, classe..." 
          class="w-full pl-11 pr-10 py-3 bg-slate-900/90 border border-slate-800 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none text-white placeholder-slate-500 text-sm transition-all"
        >
        <button id="clear-search" class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-white transition">
          <i class="fa-solid fa-circle-xmark"></i>
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-800/60">
        <!-- Filtre Rôle -->
        <select id="filter-role" class="px-3 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-300 outline-none focus:ring-2 focus:ring-brand-500 cursor-pointer">
          <option value="ALL">Tous les rôles</option>
          <option value="Élève">Élèves</option>
          <option value="Parent">Parents</option>
          <option value="Enseignant">Enseignants / Profs</option>
          <option value="Personnel">Personnel</option>
        </select>

        <!-- Filtre Classe -->
        <select id="filter-class" class="px-3 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-300 outline-none focus:ring-2 focus:ring-brand-500 cursor-pointer">
          <option value="ALL">Toutes les classes</option>
        </select>

        <!-- Tri Alphabétique -->
        <select id="sort-order" class="px-3 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-300 outline-none focus:ring-2 focus:ring-brand-500 cursor-pointer">
          <option value="AZ">Nom (A ➔ Z)</option>
          <option value="ZA">Nom (Z ➔ A)</option>
        </select>
      </div>
    </div>

    <!-- Dépôt de fichier manuel -->
    <div id="drop-zone" class="hidden mb-8 p-6 rounded-2xl border-2 border-dashed border-slate-800 hover:border-brand-500/50 bg-slate-900/40 text-center transition cursor-pointer">
      <i class="fa-solid fa-file-arrow-up text-3xl text-brand-400 mb-2"></i>
      <p class="text-sm text-slate-300 font-medium">Glissez-déposez le fichier <code class="text-brand-400">data.json</code> ici</p>
      <input type="file" id="file-input" accept=".json" class="hidden">
    </div>

    <!-- Grille des Cartes -->
    <div id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden py-16 text-center">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-600">
        <i class="fa-solid fa-user-slash text-2xl"></i>
      </div>
      <h3 class="text-base font-semibold text-slate-300">Aucun résultat trouvé</h3>
    </div>

  </div>

  <script>
    let rawData = [];

    const bgGradients = [
      'from-blue-600 to-indigo-600',
      'from-emerald-600 to-teal-600',
      'from-purple-600 to-pink-600',
      'from-amber-500 to-orange-600',
      'from-cyan-600 to-blue-600',
      'from-rose-600 to-red-600'
    ];

    function getInitials(name) {
      if (!name) return '??';
      const parts = name.trim().split(' ');
      return parts.length >= 2 
        ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
        : name.substring(0, 2).toUpperCase();
    }

    function getGradient(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return bgGradients[Math.abs(hash) % bgGradients.length];
    }

    function getRoleBadge(role, classe) {
      switch(role) {
        case 'Enseignant':
          return `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-indigo-500/15 text-indigo-400 border border-indigo-500/20">Professeur</span>`;
        case 'Personnel':
          return `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-amber-500/15 text-amber-400 border border-amber-500/20">Personnel</span>`;
        case 'Parent':
          return `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/20">Parent</span>`;
        default:
          return `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-brand-500/15 text-brand-400 border border-brand-500/20">Classe ${classe || 'N/C'}</span>`;
      }
    }

    async function loadData() {
      const dropZone = document.getElementById('drop-zone');
      try {
        const response = await fetch('./data.json');
        if (!response.ok) throw new Error("Chargement direct bloqué");
        rawData = await response.json();
        dropZone.classList.add('hidden');
        initApp();
      } catch (err) {
        dropZone.classList.remove('hidden');
      }
    }

    function initApp() {
      let students = 0, teachers = 0, staff = 0, parents = 0;
      const classesSet = new Set();

      rawData.forEach(item => {
        if (item.role === 'Enseignant') teachers++;
        else if (item.role === 'Personnel') staff++;
        else if (item.role === 'Parent') parents++;
        else {
          students++;
          if (item.class && item.class !== 'N/C') classesSet.add(item.class);
        }
      });

      document.getElementById('stat-students').textContent = students;
      document.getElementById('stat-teachers').textContent = teachers;
      document.getElementById('stat-staff').textContent = staff;
      document.getElementById('stat-parents').textContent = parents;

      const classSelect = document.getElementById('filter-class');
      classSelect.innerHTML = '<option value="ALL">Toutes les classes</option>';
      Array.from(classesSet).sort().forEach(cls => {
        const opt = document.createElement('option');
        opt.value = cls;
        opt.textContent = `Classe ${cls}`;
        classSelect.appendChild(opt);
      });

      renderCards();
    }

    function renderCards() {
      const grid = document.getElementById('cards-grid');
      const emptyState = document.getElementById('empty-state');
      
      const search = document.getElementById('search-input').value.toLowerCase().trim();
      const roleFilter = document.getElementById('filter-role').value;
      const classFilter = document.getElementById('filter-class').value;
      const sortOrder = document.getElementById('sort-order').value;

      let filtered = rawData.filter(item => {
        const matchesSearch = item.displayName.toLowerCase().includes(search) ||
                              (item.class && item.class.toLowerCase().includes(search));
        
        const matchesRole = roleFilter === 'ALL' || item.role === roleFilter;
        const matchesClass = classFilter === 'ALL' || item.class === classFilter;

        return matchesSearch && matchesRole && matchesClass;
      });

      filtered.sort((a, b) => {
        const nameA = a.displayName.toLowerCase();
        const nameB = b.displayName.toLowerCase();
        return sortOrder === 'AZ' ? nameA.localeCompare(nameB) : nameB.localeCompare(nameA);
      });

      grid.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      filtered.forEach((item, index) => {
        const initials = getInitials(item.displayName);
        const gradient = getGradient(item.displayName);

        const card = document.createElement('div');
        card.className = "glass-panel rounded-2xl p-5 hover:border-slate-700/80 transition-all duration-200 card-animate flex flex-col justify-between";
        card.style.animationDelay = `${Math.min(index * 0.03, 0.3)}s`;

        let cardHTML = `
          <div>
            <div class="flex items-start justify-between gap-3 mb-4">
              <div class="w-12 h-12 rounded-xl bg-gradient-to-tr ${gradient} flex items-center justify-center text-white font-bold text-base shadow-lg shrink-0">
                ${initials}
              </div>
              ${getRoleBadge(item.role, item.class)}
            </div>

            <h3 class="font-bold text-white text-base leading-snug">
              ${item.displayName}
            </h3>
            
            <p class="text-xs text-slate-400 mt-1">
              ${item.school || 'CLG-LOUIS LUMIERE'}
            </p>
        `;

        if (item.motto) {
          cardHTML += `
            <p class="mt-3 text-xs italic text-slate-300 bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/50">
              « ${item.motto} »
            </p>
          `;
        }

        if (item.hobbies && item.hobbies.length > 0) {
          cardHTML += `
            <div class="mt-3 flex flex-wrap gap-1">
              ${item.hobbies.map(h => `<span class="px-2 py-0.5 rounded bg-slate-800 text-[10px] text-slate-400">${h}</span>`).join('')}
            </div>
          `;
        }

        cardHTML += `</div>`;

        // Section Relations (Parents pour l'élève / Enfants pour le parent)
        if (item.relations && item.relations.length > 0) {
          const isParentRole = item.role === 'Parent';
          const title = isParentRole ? 'Enfant(s) rattaché(s)' : 'Responsable(s)';
          const icon = isParentRole ? 'fa-user-graduate text-brand-400' : 'fa-people-roof text-emerald-400';
          const dotColor = isParentRole ? 'bg-brand-400' : 'bg-emerald-400';

          cardHTML += `
            <div class="mt-4 pt-3 border-t border-slate-800/80">
              <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider block mb-1.5">
                <i class="fa-solid ${icon} me-1"></i> ${title}
              </span>
              <div class="space-y-1">
                ${item.relations.map(rel => `
                  <div class="text-xs text-slate-300 font-medium flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full ${dotColor} inline-block"></span>
                    ${rel}
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        card.innerHTML = cardHTML;
        grid.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadData();

      const searchInput = document.getElementById('search-input');
      const clearSearch = document.getElementById('clear-search');

      searchInput.addEventListener('input', () => {
        clearSearch.classList.toggle('hidden', searchInput.value.length === 0);
        renderCards();
      });

      clearSearch.addEventListener('click', () => {
        searchInput.value = '';
        clearSearch.classList.add('hidden');
        renderCards();
      });

      document.getElementById('filter-role').addEventListener('change', renderCards);
      document.getElementById('filter-class').addEventListener('change', renderCards);
      document.getElementById('sort-order').addEventListener('change', renderCards);

      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('file-input');

      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              rawData = JSON.parse(event.target.result);
              dropZone.classList.add('hidden');
              initApp();
            } catch (err) {
              alert("Erreur de format JSON.");
            }
          };
          reader.readAsText(file);
        }
      });
    });
  </script>
</body>
</html>
